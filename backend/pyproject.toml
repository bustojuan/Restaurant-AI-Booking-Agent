[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-booking-backend"
version = "0.1.0"
description = "Restaurant booking API with LangGraph and guarded voice/telephony integration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "tzdata>=2025.1", "filelock>=4.2.1,<5",
  "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-core>=1,<2",
  "openai>=2,<3", "twilio>=9,<10", "httpx>=0.28,<1", "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
audio = ["sounddevice>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*.md", "ai/evaluations/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

