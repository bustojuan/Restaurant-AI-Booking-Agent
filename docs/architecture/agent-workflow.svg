<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="840" viewBox="0 0 1920 840" role="img" aria-labelledby="title description">
<title id="title">BARIA — AI Restaurant Booker · Multi-agent workflow</title>
<desc id="description">Configured BARIA booking workflow. Planning feeds Supervisor. Its conditional contact branch runs Research and Voice Session, then stored Offer Review and Confirmation Review return to Supervisor. During contact, the voice service can delegate decisions to Negotiation or Verification and receive their results. Simulation performs direct checks. Human approval and pause resume Supervisor. Its finish branch leads to Memory and Summary, then Evaluation. Backend outcomes are persisted decisions, not additional graph nodes.</desc>
